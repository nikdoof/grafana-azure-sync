[project]
name = "grafana-azure-sync"
version = "0.1.0"
description = "Synchronize Microsoft Entra ID groups with Grafana teams"
readme = "README.md"
authors = [
  { name = "Rassul Amangeldi" },
  { name = "Andrew Williams", email = "andy@tensixtyone.com" },
]
requires-python = ">=3.13"
dependencies = ["python-dotenv>=1.2.4", "requests>=2.34.2"]

[project.scripts]
grafana-azure-sync = "grafana_azure_sync.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
